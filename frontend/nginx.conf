# Single-page app + API reverse proxy.
# Browser -> nginx (:80) -> backend:8080 for /api/*, static files otherwise.
server {
    listen 80;

    # Frontend calls relative '/api/v1/...', so no CORS / no hardcoded host needed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        # SPA fallback: unknown paths serve index.html so react-router works
        try_files $uri $uri/ /index.html;
    }
}
