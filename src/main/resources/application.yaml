spring:
  application:
    name: blog

  datasource:
    # Default for LOCAL runs (./mvnw spring-boot:run on your laptop).
    # Host port is 5433 because your Mac already runs postgres on 5432.
    # When backend runs in Docker, compose overrides this via
    # SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/postgres (see docker-compose.yml).
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: a
#    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: "your-super-secret-key-that-is-at-least-256-bits-long-for-security"